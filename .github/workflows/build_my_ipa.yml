name: Build My Custom IPA
on:
  workflow_dispatch:
    inputs:
      decrypted_ipa_url:
        description: 'Direct Link to Decrypted Vanilla Spotify IPA'
        required: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Your Custom Code
        uses: actions/checkout@v4

      - name: Set up Swift Environment
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.9'

      - name: Configure Local Compilation Profile
        run: |
          git clone --recursive "https://github.com" "$HOME/theos"
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          make spm

      - name: Build Tweak Binary Natively
        run: |
          export THEOS="$HOME/theos"
          swift build -c release --triple arm64-apple-ios
          mkdir -p layout/Library/MobileSubstrate/DynamicLibraries
          cp .build/release/EeveeSpotify.dylib layout/Library/MobileSubstrate/DynamicLibraries/

      - name: Download and Unpack Vanilla Spotify
        run: |
          curl -L "${{ github.event.inputs.decrypted_ipa_url }}" -o incoming_app.ipa
          unzip incoming_app.ipa -d spotify_app

      - name: Inject Custom Code Into IPA Bundle
        run: |
          git clone "https://github.com"
          cd ivinject && gcc ivinject.c -o ivinject && cd ..
          ./ivinject/ivinject -o spotify_app/Payload/Spotify.app/Spotify -t layout/Library/MobileSubstrate/DynamicLibraries/EeveeSpotify.dylib

      - name: Package Your Final Custom IPA
        run: |
          cd spotify_app
          zip -r ../NexusSpotify.ipa Payload
          cd ..

      - name: Upload Finished Custom IPA to Github Releases
        uses: softprops/action-gh-release@v1
        with:
          files: NexusSpotify.ipa
          tag_name: "nexus-v${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
